<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" fill="none">
  <defs>
    <linearGradient id="dropGrad" x1="12" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF4D4D"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#FF7043"/>
    </linearGradient>
  </defs>
  <!-- Blood Droplet Icon -->
  <g transform="translate(4, 4)">
    <path d="M28 6 C28 6 12 26 12 38 C12 47 19.16 54 28 54 C36.84 54 44 47 44 38 C44 26 28 6 28 6Z" fill="url(#dropGrad)"/>
    <!-- Medical Cross inside droplet -->
    <rect x="25.5" y="27" width="5" height="15" rx="2.5" fill="#FFFFFF"/>
    <rect x="20.5" y="32" width="15" height="5" rx="2.5" fill="#FFFFFF"/>
  </g>
  <!-- Connected Link Pulse -->
  <path d="M56 34 H68 L73 24 L79 44 L85 30 L89 36 L95 34 H105" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text: BloodLink -->
  <text x="112" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="800" fill="#1E293B">
    Blood<tspan fill="#E53935">Link</tspan>
  </text>
</svg>
